<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi Aplicación Web</title>
  <!-- Fuentes Google -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
  <!-- Archivo de Estilos CSS -->
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- ==================== SLIDE 1: AUTENTICACIÓN ==================== -->
  <div class="slide active" id="authSlide">
    <div class="auth-card">
      
      <!-- Pestañas -->
      <div class="tabs">
        <button class="tab-btn active" id="loginTabBtn" onclick="mostrarTab('login')">Iniciar Sesión</button>
        <button class="tab-btn" id="registerTabBtn" onclick="mostrarTab('register')">Registrarse</button>
      </div>

      <!-- Formulario de Iniciar Sesión -->
      <form id="loginForm">
        <div class="form-group">
          <label for="loginEmail">Correo Electrónico</label>
          <input type="email" id="loginEmail" required placeholder="correo@ejemplo.com">
        </div>
        <div class="form-group">
          <label for="loginPassword">Contraseña</label>
          <input type="password" id="loginPassword" required placeholder="••••••••">
        </div>
        <span class="error-msg" id="loginError">Usuario o contraseña incorrectos.</span>
        <button type="submit" class="btn-primary">Entrar</button>
      </form>

      <!-- Formulario de Registro -->
      <form id="registerForm" style="display: none;">
        <div class="form-group">
          <label for="regUser">Nombre de Usuario</label>
          <input type="text" id="regUser" required placeholder="Tu nombre o apodo">
        </div>
        <div class="form-group">
          <label for="regEmail">Correo Electrónico</label>
          <input type="email" id="regEmail" required placeholder="correo@ejemplo.com">
        </div>
        <div class="form-group">
          <label for="regPassword">Contraseña</label>
          <input type="password" id="regPassword" required placeholder="••••••••">
        </div>
        <button type="submit" class="btn-primary">Crear Cuenta</button>
      </form>

    </div>
  </div>

  <!-- ==================== SLIDE 2: PANEL (AZUL) ==================== -->
  <div class="slide" id="dashboardSlide">
    <div class="dashboard-content">
      <h1>¡Bienvenido/a, <span id="userNameDisplay">Usuario</span>!</h1>
      <p>Has iniciado sesión correctamente. Esta es la nueva Slide de fondo azul.</p>
      
      <button class="btn-logout" onclick="cerrarSesion()">Cerrar Sesión</button>
    </div>
  </div>

  <!-- Lógica JavaScript Principal -->
  <script src="app.js"></script>
</body>
</html>
